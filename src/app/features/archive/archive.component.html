<ks-archive-hero
  [searchTerm]="searchTerm()"
  [filterOptions]="filterOptions"
  [activeFilter]="activeFilter()"
  (searchChange)="onSearch($event)"
  (filterChange)="setFilter($event)"
/>

@if (loading()) {
  <div class="state"><span class="loading-spinner" aria-label="Ładowanie"></span></div>
} @else if (error()) {
  <div class="state state--error">{{ error() }}</div>
} @else {
  <section class="archive-grid">
    @for (post of displayedPosts(); track post.id) {
      <ks-article-card [post]="post" />
    } @empty {
      <p class="empty">Nie znaleziono wpisów dla tej frazy.</p>
    }
  </section>

  <ks-archive-paginator
    [total]="displayedTotal()"
    [page]="page()"
    [totalPages]="totalPages()"
    [pageNumbers]="pageNumbers()"
    [perPage]="perPage()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="setPage($event)"
    (pageSizeChange)="setPageSize($event)"
  />
}
