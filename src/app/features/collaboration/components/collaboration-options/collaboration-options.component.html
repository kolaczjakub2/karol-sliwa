<section class="cooperation-options">
  <header class="section-heading">
    <span class="eyebrow">Możliwości</span>
    <h2>Nie tylko baner. Chodzi o pomysł.</h2>
  </header>

  <div class="cooperation-options__grid">
    @for (option of options(); track option.title) {
      <article>
        <ks-icon [name]="option.icon" />
        <h3>{{ option.title }}</h3>
        <p>{{ option.description }}</p>
      </article>
    }
  </div>
</section>
