<section class="trusted">
  <div class="trusted__copy">
    <span class="eyebrow">Zaufali</span>
    <h2>Wybrane marki i projekty.</h2>
    <p>
      Od pojedynczych publikacji po większe akcje. Zakres zawsze wynikał z celu,
      tematu i tego, co miało sens dla odbiorców.
    </p>
  </div>

  <div class="brand-cloud" aria-label="Przykładowe marki">
    @for (brand of brands(); track brand.name) {
      <figure>
        <img [src]="brand.logoUrl" [alt]="brand.name" loading="lazy" decoding="async">
        <figcaption>{{ brand.name }}</figcaption>
      </figure>
    }
  </div>
</section>
