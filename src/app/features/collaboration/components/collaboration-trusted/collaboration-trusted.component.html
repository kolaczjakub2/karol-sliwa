<section class="trusted">
  <div class="trusted__copy">
    <span class="eyebrow">Zaufali</span>
    <h2>Marki i projekty, które już były po tej stronie parkietu.</h2>
    <p>
      Na przestrzeni lat Karol współpracował z różnymi firmami i brał udział
      w bardzo różnych projektach. Forma jest otwarta, liczy się dopasowanie.
    </p>
  </div>

  <div class="brand-cloud" aria-label="Przykładowe marki">
    @for (brand of brands(); track brand) {
      <span>{{ brand }}</span>
    }
  </div>
</section>
