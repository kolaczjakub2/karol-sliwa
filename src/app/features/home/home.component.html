@if (loading()) {
  <section class="loading-state">
    <mat-spinner diameter="42" />
    <p>Pobieram najnowsze wpisy…</p>
  </section>
} @else if (error()) {
  <section class="error-state">
    <h1>Nie udało się pobrać wpisów</h1>
    <p>{{ error() }}</p>
    <a mat-flat-button routerLink="/archiwum">Przejdź do archiwum</a>
  </section>
} @else {
  @for (post of heroSlide(); track post.id) {
    <ks-home-hero
      [post]="post"
      [heroPosts]="heroPosts()"
      [activeIndex]="heroIndex()"
      [direction]="heroDirection()"
      [podcastPost]="podcastPost()"
      (heroSelected)="selectHero($event)"
      (previous)="previousHero()"
      (next)="nextHero()"
      (pauseChange)="setHeroPaused($event)"
    />
  }

  <ks-home-topics [formats]="formats" (formatSelected)="setFilter($event)" />

  <ks-home-latest
    [posts]="filteredLatest()"
    [filterOptions]="filterOptions"
    [activeFilter]="activeFilter()"
    (filterChange)="setFilter($event)"
  />

  @if (podcastPost(); as podcast) {
    <ks-home-podcast [podcast]="podcast" [episodes]="recentPodcastPosts()" />
  }

  <ks-home-author />
}
