<section class="podcast" id="podcast">
  <div class="podcast__label">Podcast</div>
  <div class="podcast__image">
    <img
      [src]="podcast().imageUrl"
      [attr.srcset]="podcast().imageSrcSet || null"
      sizes="(max-width: 760px) 100vw, 35vw"
      [alt]="podcast().imageAlt"
      [attr.width]="podcast().imageWidth"
      [attr.height]="podcast().imageHeight"
      loading="lazy"
      decoding="async"
    >
    <button mat-fab aria-label="Odtwórz odcinek">
      <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M8 5v14l11-7z" />
      </svg>
    </button>
  </div>
  <div class="podcast__copy">
    <span class="eyebrow">Nowy odcinek</span>
    <h2>{{ podcast().title }}</h2>
    <a [routerLink]="['/', podcast().slug]">
      Słuchaj / czytaj teraz
      <span class="link-arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16" focusable="false">
          <path d="M3.5 8h8" />
          <path d="m8.5 4 4 4-4 4" />
        </svg>
      </span>
    </a>
  </div>
  <div class="podcast__episodes">
    <span>Ostatnie odcinki</span>
    @for (episode of episodes(); track episode.id) {
      <a [routerLink]="['/', episode.slug]">
        <span>{{ episode.title }}</span>
        <strong>{{ episode.date | date:'d MMM y':'':'pl' }}</strong>
      </a>
    } @empty {
      <p>Brak starszych odcinków w aktualnie pobranej puli.</p>
    }
  </div>
</section>
