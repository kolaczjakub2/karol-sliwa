<section class="feature-wall" aria-label="Najważniejsze obszary">
  @for (card of cards(); track card.title) {
    <article class="feature-card">
      <ks-icon [name]="card.icon" />
      <span>{{ card.kicker }}</span>
      <h2>{{ card.title }}</h2>
      <p>{{ card.description }}</p>
    </article>
  }
</section>
