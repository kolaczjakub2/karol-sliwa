<section class="off-court">
  <nav class="social-grid" aria-label="Profile społecznościowe">
    @for (link of socialLinks(); track link.href) {
      <a [href]="link.href" target="_blank" rel="noopener">
        <ks-icon [name]="link.icon" />
        <span>{{ link.label }}</span>
      </a>
    }
  </nav>
</section>
