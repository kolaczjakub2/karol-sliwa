<figure
  class="hero-image"
  [style.--hero-aspect-ratio]="article().imageWidth / article().imageHeight"
  [style.aspect-ratio]="article().imageWidth + ' / ' + article().imageHeight"
>
  <img
    [src]="article().imageUrl"
    [attr.srcset]="article().imageSrcSet || null"
    sizes="(max-width: 1180px) 100vw, 1180px"
    [alt]="article().imageAlt"
    [attr.width]="article().imageWidth"
    [attr.height]="article().imageHeight"
    fetchpriority="high"
    decoding="async"
  >
</figure>

<div class="article-layout">
  <section class="content" [innerHTML]="trustedContentHtml()"></section>
</div>
