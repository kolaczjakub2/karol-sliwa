@if (loading()) {
  <section class="state"><mat-spinner diameter="42" /></section>
} @else if (error()) {
  <section class="state state--error">{{ error() }}</section>
} @else if (post(); as article) {
  <article class="article">
    <ks-post-article-header [article]="article" />
    <ks-post-article-body [article]="article" (commentsLinkClicked)="scrollToComments($event)" />
    <ks-post-comments
      [article]="article"
      [rows]="commentRows()"
      [loading]="commentsLoading()"
      [error]="commentsError()"
      [form]="commentForm"
      [submitting]="submittingComment()"
      [notice]="commentNotice()"
      [replyingTo]="replyingTo()"
      (replyStarted)="startReply($event)"
      (replyCanceled)="cancelReply()"
      (submitted)="submitComment($event)"
    />
  </article>
} @else {
  <section class="state">Nie znaleziono wpisu.</section>
}
