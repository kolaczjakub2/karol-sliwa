<a class="tile" href="#najnowsze" (click)="selected.emit(title())">
  <mat-icon fontSet="material-icons-outlined">{{ icon() }}</mat-icon>
  <h3>{{ title() }}</h3>
  <p>{{ description() }}</p>
  <span>
    Zobacz
    <span class="link-arrow" aria-hidden="true">
      <svg viewBox="0 0 16 16" focusable="false">
        <path d="M3.5 8h8" />
        <path d="m8.5 4 4 4-4 4" />
      </svg>
    </span>
  </span>
</a>
